# One-off probe (runs once on push): discover the JSON APIs behind Iranian market sites that answer from abroad.
name: source-probe
on:
  push:
    paths: ['.github/workflows/source-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set +e
          mkdir -p probe
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, ssl, re, time
          UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          def get(u, n=3000000):
              t0 = time.time()
              try:
                  rq = urllib.request.Request(u, headers={"User-Agent": UA, "Origin": "https://amir6990.github.io", "Accept": "application/json, text/plain, */*", "Referer": u})
                  with urllib.request.urlopen(rq, timeout=20) as r:
                      b = r.read(n); return {"status": r.status, "acao": r.headers.get("Access-Control-Allow-Origin"), "ctype": r.headers.get("Content-Type"), "size": len(b), "body": b.decode("utf-8", "replace"), "secs": round(time.time()-t0,1)}
              except urllib.error.HTTPError as e:
                  return {"status": e.code, "acao": e.headers.get("Access-Control-Allow-Origin"), "body": e.read(400).decode("utf-8","replace"), "secs": round(time.time()-t0,1)}
              except Exception as e:
                  return {"status": 0, "body": str(e)[:200], "secs": round(time.time()-t0,1)}
          out = {"discover": {}, "tries": []}
          for site in ["https://rahavard365.com/asset/1", "https://www.sahamyab.com/", "https://www.tablokhani.com/", "https://www.bourseeye.com/", "https://www.nabzebourse.com/", "https://ra100.ir/"]:
              r = get(site); html = r.get("body", "")
              base = "{0.scheme}://{0.netloc}".format(urllib.parse.urlparse(site))
              js = [urllib.parse.urljoin(site, s) for s in re.findall(r'<script[^>]+src="([^"]+)"', html)][:25]
              found = set(re.findall(r'["\'`](https?://[^"\'`\s]*api[^"\'`\s]*|/api/[^"\'`\s]{2,120})["\'`]', html))
              for j in js:
                  b = get(j).get("body", "")
                  found |= set(re.findall(r'["\'`](https?://[^"\'`\s]*api[^"\'`\s]{0,120}|/api/[^"\'`\s]{2,120})["\'`]', b))
              out["discover"][site] = sorted(found)[:150]
          tries = [
            "https://rahavard365.com/api/v2/search?keyword=%D9%81%D9%88%D9%84%D8%A7%D8%AF",
            "https://rahavard365.com/api/v2/chart/bars?countback=10&symbol=exchange.asset:1:real_close&resolution=D",
            "https://www.sahamyab.com/api/proxy/symbol/getSymbolExtData?v=0.1&code=%D9%81%D9%88%D9%84%D8%A7%D8%AF&stockWatch=1",
            "https://www.sahamyab.com/api/proxy/symbol/getSymbolExtData?code=%D9%81%D9%88%D9%84%D8%A7%D8%AF",
            "https://www.sahamyab.com/api/proxy/symbol/getChartdata?v=0.1&code=%D9%81%D9%88%D9%84%D8%A7%D8%AF",
            "https://www.sahamyab.com/api/proxy/symbol/getChartData?code=%D9%81%D9%88%D9%84%D8%A7%D8%AF&type=day",
            "https://www.sahamyab.com/guest/api/symbol/history?symbol=%D9%81%D9%88%D9%84%D8%A7%D8%AF",
          ]
          for u in tries:
              r = get(u); r["url"] = u; r["body"] = r.get("body","")[:400]; out["tries"].append(r); print(r["status"], r.get("acao"), u)
          json.dump(out, open("probe/apis.json", "w"), ensure_ascii=False, indent=1)
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add probe && git commit -q -m "probe: discover market-data APIs" && git push -q || echo nothing

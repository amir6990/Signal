<script>
/* Shared scheduling and calibration engine.
   Replaces fixed Leitner boxes with a graded, ease-adjusted interval, adds lapse
   tracking so a chronically failed card is treated differently from a new one, and
   records confidence alongside correctness so "sure and wrong" can be surfaced —
   that pairing is where a misconception lives, and a box count cannot show it. */
const LEARN=(function(){
  const DAY=864e5;
  const Q={AGAIN:0,HARD:1,GOOD:2,EASY:3};
  const LEECH=4;                 /* lapses before a card is called out */
  const EASE0=2.3, EMIN=1.3, EMAX=2.9;

  function st(S,k){
    S.c=S.c||{};
    return S.c[k]||(S.c[k]={n:0,i:0,e:EASE0,d:0,l:0,cw:0,ok:0,no:0});
  }
  function due(S,k){return st(S,k).d<=Date.now();}
  function dueIn(S,k){return st(S,k).d;}
  function isLeech(S,k){return st(S,k).l>=LEECH;}
  function confWrong(S,k){return st(S,k).cw;}

  /* q: 0 again, 1 hard, 2 good, 3 easy. conf: true if the learner said they were sure. */
  function grade(S,k,q,conf){
    const c=st(S,k);
    c.n++;
    if(q===Q.AGAIN){
      c.l++; c.ok=c.ok; c.no=(c.no||0)+1;
      if(conf)c.cw=(c.cw||0)+1;          /* sure, and wrong */
      c.e=Math.max(EMIN,c.e-0.2);
      c.i=0;                              /* relearn today */
      c.d=Date.now();
    }else{
      c.ok=(c.ok||0)+1;
      c.e=Math.min(EMAX,c.e+(q===Q.EASY?0.12:q===Q.HARD?-0.14:0.02));
      /* a card that has lapsed repeatedly re-grows more slowly */
      const brake=c.l>=LEECH?0.6:1;
      if(c.i===0)c.i=q===Q.EASY?2:1;
      else if(c.i===1)c.i=q===Q.HARD?2:(q===Q.EASY?5:3);
      else c.i=Math.max(c.i+1,Math.round(c.i*c.e*brake*(q===Q.HARD?0.6:1)));
      c.i=Math.min(c.i,400);
      c.d=Date.now()+c.i*DAY;
    }
    return c;
  }
  /* a coarse bucket, only for the progress strip */
  function bucket(S,k){const i=st(S,k).i;
    return i===0?0:i<=1?1:i<=3?2:i<=10?3:4;}
  function summary(S,keys){
    const b=[0,0,0,0,0]; let leech=0,cw=0,dueN=0;
    keys.forEach(k=>{b[bucket(S,k)]++; if(isLeech(S,k))leech++; if(confWrong(S,k))cw++; if(due(S,k))dueN++;});
    return {b,leech,cw,due:dueN};
  }
  return {Q,DAY,st,due,dueIn,isLeech,confWrong,grade,bucket,summary,LEECH};
})();


const FA='۰۱۲۳۴۵۶۷۸۹', fa=s=>String(s).replace(/\d/g,d=>FA[d]);
const el=id=>document.getElementById(id), V=()=>el('view');
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let view='ph';

const KEY='ipo_v1', DAY=864e5;
let ST={box:{},due:{},ck:{},rec:{},stat:{}};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null'); if(r)ST=Object.assign(ST,r);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}};
const IVL=[0,1,3,7,21];
ST.c=ST.c||{};
const boxOf=k=>LEARN.bucket(ST,k), dueNow=k=>LEARN.due(ST,k);
/* confidence is captured before the answer is revealed, so "sure and wrong" is
   recorded as it happens rather than reconstructed afterwards */
let sure=false;
const grade=(k,ok,q)=>{LEARN.grade(ST,k,ok?(q===undefined?LEARN.Q.GOOD:q):LEARN.Q.AGAIN,sure);save();};

const S=G.steps, PH=G.phases;
const phName=n=>{const p=PH.find(x=>x.n===n);return p?('فاز '+fa(p.n)+' · '+p.nm):'—';};
const byPhase=n=>S.filter(x=>x.ph===n);
const FIELDS=[['who','مسئول اصلی'],['flow','مسیر گردش کار'],['pre','پیش‌نیاز'],['out','خروجی مرحله'],
              ['time','زمان تقریبی'],['law','مبنای مقرراتی'],['risk','نکته کلیدی / ریسک'],
              ['forms','فرم‌ها و مدارک'],['note','توضیح فرم و نکات تکمیل']];

/* ---------- 1. phases: the spine ---------- */
let pPlaced=[],pPool=[],pDone=false,pDrill=false;
function phInit(){pDrill=false;pPlaced=[];pDone=false;drawPh();}
function pdInit(){pDrill=true;pPlaced=[];pDone=false;pPool=shuf(PH.map((x,i)=>i));drawPh();}
function drawPh(){
  let h='<div class="card"><h2>هشت فاز</h2><p class="note" style="margin:0">'+
    'هر یک از ۴۹ مرحله داخل یکی از این هشت فاز می‌نشیند. وقتی گم شدید، اول بپرسید در کدام فازید.'+
    ((ST.rec.ph||0)?' بهترین رکورد: <b>'+fa(ST.rec.ph)+' از '+fa(PH.length)+'</b>.':'')+'</p></div>';
  if(!pDrill){
    h+='<div class="card">';
    PH.forEach((p,i)=>{const n=byPhase(p.n).length;
      h+='<div class="rn"><span class="who" style="background:var(--acc)">فاز '+fa(p.n)+'</span>'+
         '<span class="wh">'+p.nm+'<span class="gg">'+fa(n)+' مرحله</span></span></div>'+
         (i<PH.length-1?'<div class="rarr">↓</div>':'');});
    h+='</div><button class="btn" id="pd">تمرین ترتیب فازها</button>';
    V().innerHTML=h; el('pd').onclick=pdInit; return;
  }
  h+='<div class="card"><h2>ترتیب شما</h2>';
  if(!pPlaced.length)h+='<p class="note" style="margin:0">هنوز چیزی انتخاب نکرده‌اید.</p>';
  pPlaced.forEach((ix,k)=>{const ok=ix===k;
    h+='<button class="slot'+(pDone?(ok?' ok':' no'):'')+'" disabled><span class="num">'+fa(k)+'</span>'+
       '<span>'+PH[ix].nm+(pDone&&!ok?' — جای درستش فاز '+fa(PH[ix].n):'')+'</span></button>';});
  h+='</div>';
  if(pPool.length){
    h+='<div class="card"><h2>فاز '+fa(pPlaced.length)+' کدام است؟</h2>';
    pPool.forEach(ix=>h+='<button class="slot pick" data-p="'+ix+'"><span class="num">؟</span><span>'+PH[ix].nm+'</span></button>');
    h+='</div>';
  }else{
    const r=pPlaced.filter((ix,k)=>ix===k).length;
    if(r>(ST.rec.ph||0)){ST.rec.ph=r;save();}
    h+='<div class="res"><h2>نتیجه</h2><div class="big"><span class="k">درست</span><span class="v">'+
      fa(r)+' از '+fa(PH.length)+'</span></div>'+(r===PH.length?'<div class="flag">کامل درست.</div>':'<div class="flag bad">جاهای قرمز را ببینید.</div>')+'</div>'+
      '<div class="row2"><button class="btn g" id="pv">دیدن فازها</button><button class="btn" id="pa">دوباره</button></div>';
  }
  V().innerHTML=h;
  V().querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    pPlaced.push(+b.dataset.p);pPool=pPool.filter(x=>x!==+b.dataset.p);
    if(!pPool.length)pDone=true;drawPh();});
  const a=el('pa'); if(a)a.onclick=pdInit;
  const v=el('pv'); if(v)v.onclick=phInit;
}

/* ---------- 2. steps: auto-graded mixed drill, scheduled per direction ---------- */
const mkOpts=(correct,pool,n)=>{
  const seen=new Set([correct]),ds=[];
  shuf(pool.slice()).forEach(t=>{if(ds.length<n-1&&t&&!seen.has(t)){seen.add(t);ds.push(t);}});
  return shuf([{t:correct,ok:true}].concat(ds.map(t=>({t,ok:false}))));
};
const sIx=g=>S.findIndex(x=>x.g===g);
const chain=i=>{const a=S[i-1],x=S[i],b=S[i+1];
  return (a?'مرحله '+fa(a.g)+' '+a.t+' ← ':'')+'<b>مرحله '+fa(x.g)+' '+x.t+'</b>'+(b?' ← مرحله '+fa(b.g)+' '+b.t:'');};
const uniq=(f)=>{const c={};S.forEach(x=>{if(x[f])c[x[f]]=(c[x[f]]||0)+1;});return i=>S[i][f]&&c[S[i][f]]===1;};
const uOut=uniq('out'), uWho=uniq('who'), uFlow=uniq('flow');
const CAN={
  phase:i=>S[i].ph!=null,
  out:i=>uOut(i), rev:i=>uOut(i),
  who:i=>!!S[i].who&&uWho(i),
  flow:i=>!!S[i].flow&&uFlow(i),
  next:i=>i+1<S.length,
  time:i=>!!S[i].time, law:i=>!!S[i].law, risk:i=>!!S[i].risk
};
const TYPES=['phase','out','rev','who','flow','next','time','law','risk'];
const TL={phase:'فاز',out:'خروجی',rev:'مرحله از خروجی',who:'مسئول',flow:'گردش کار',
          next:'مرحلهٔ بعد',time:'زمان',law:'مبنای مقرراتی',risk:'ریسک'};
const GEN={
  phase:c=>({q:'این مرحله در کدام فاز است؟',s:S[c.i].t,
    o:mkOpts(phName(S[c.i].ph),PH.filter(p=>p.n!==S[c.i].ph).map(p=>phName(p.n)),4),
    why:'مرحله '+fa(S[c.i].g)+' از ۴۹'}),
  out:c=>({q:'خروجی این مرحله چیست؟',s:S[c.i].t,
    o:mkOpts(S[c.i].out,S.filter((y,j)=>j!==c.i&&CAN.out(j)).map(y=>y.out),4),
    why:'مرحله '+fa(S[c.i].g)+' · '+phName(S[c.i].ph)}),
  rev:c=>({q:'این خروجی از کدام مرحله می‌آید؟',s:S[c.i].out,
    o:mkOpts(S[c.i].t,S.filter((y,j)=>j!==c.i).map(y=>y.t),4),
    why:'مرحله '+fa(S[c.i].g)}),
  who:c=>({q:'مسئول اصلی این مرحله کیست؟',s:S[c.i].t,
    o:mkOpts(S[c.i].who,S.filter((y,j)=>j!==c.i&&y.who).map(y=>y.who),4),
    why:'مرحله '+fa(S[c.i].g)}),
  flow:c=>({q:'مسیر گردش کار این مرحله کدام است؟',s:S[c.i].t,
    o:mkOpts(S[c.i].flow,S.filter((y,j)=>j!==c.i&&y.flow).map(y=>y.flow),4),
    why:'مرحله '+fa(S[c.i].g)+' · '+phName(S[c.i].ph)}),
  next:c=>({q:'بعد از این مرحله چه می‌آید؟',s:S[c.i].t,
    o:mkOpts(S[c.i+1].t,S.filter((y,j)=>j!==c.i&&j!==c.i+1).map(y=>y.t),4),
    why:chain(c.i)+(S[c.i].ph!==S[c.i+1].ph?'<br>اینجا وارد '+phName(S[c.i+1].ph)+' می‌شوید.':'')}),
  time:c=>({q:'زمان تقریبی این مرحله؟',s:S[c.i].t,
    o:mkOpts(S[c.i].time,S.filter((y,j)=>j!==c.i&&y.time).map(y=>y.time),4),
    why:'مرحله '+fa(S[c.i].g)+' — زمان‌ها تقریبی‌اند و در سند به همین شکل آمده‌اند.'}),
  law:c=>({q:'مبنای مقرراتی این مرحله؟',s:S[c.i].t,
    o:mkOpts(S[c.i].law,S.filter((y,j)=>j!==c.i&&y.law).map(y=>y.law),4),
    why:'مرحله '+fa(S[c.i].g)}),
  risk:c=>({q:'نکتهٔ کلیدی یا ریسک این مرحله کدام است؟',s:S[c.i].t,
    o:mkOpts(S[c.i].risk,S.filter((y,j)=>j!==c.i&&y.risk).map(y=>y.risk),4),
    why:'مرحله '+fa(S[c.i].g)})
};
const DECK=[];
S.forEach((x,i)=>TYPES.forEach(t=>{
  if(!CAN[t](i))return;
  const c={k:'c'+x.g+':'+t,t,i,g:x.g,ph:x.ph};
  /* keep only cards that can actually be posed with four distinct options,
     so a session of twelve is twelve real questions */
  let q=null; try{q=GEN[t](c);}catch(e){}
  if(q&&q.o.length>=3)DECK.push(c);
}));

const SESS=12;
let stPh='all', stQ=[], stAt=0, stPick=-1, stCur=null, stRes=[], stMiss=[];
const pool=()=>DECK.filter(c=>stPh==='all'||c.ph===+stPh);
function build(c){
  /* distractors are drawn at random, so retry before giving up; a three-option
     question is still a fair question, fewer is not */
  for(let k=0;k<6;k++){
    let q=null; try{q=GEN[c.t](c);}catch(e){}
    if(q&&q.o.length===4)return Object.assign({},c,q);
    if(k===5&&q&&q.o.length>=3)return Object.assign({},c,q);
  }
  return null;
}
function solid(){let n=0;S.forEach((x,i)=>{const ks=TYPES.filter(t=>CAN[t](i)).map(t=>'c'+x.g+':'+t);
  if(ks.length&&ks.every(k=>boxOf(k)>=2))n++;});return n;}
function stInit(){
  stQ=shuf(pool().filter(c=>dueNow(c.k))).slice(0,SESS);
  stAt=0;stPick=-1;stRes=[];stMiss=[];stCur=stQ[0]?build(stQ[0]):null;drawSt();
}
function stHead(){
  const p=pool(), due=p.filter(c=>dueNow(c.k)).length, cnt=[0,0,0,0,0];
  p.forEach(c=>cnt[boxOf(c.k)]++);
  return '<div class="card"><h2>مراحل</h2><select id="sp">'+
    '<option value="all">همهٔ فازها — '+fa(S.length)+' مرحله</option>'+
    PH.map(x=>'<option value="'+x.n+'"'+(String(x.n)===stPh?' selected':'')+'>فاز '+fa(x.n)+' · '+x.nm+' — '+fa(byPhase(x.n).length)+'</option>').join('')+
    '</select><div class="boxes">'+['تازه','۱ روز','۳ روز','۷ روز','۲۱ روز']
      .map((n,i)=>'<div>'+n+'<b>'+fa(cnt[i])+'</b></div>').join('')+'</div>'+
    '<p class="note">'+fa(p.length)+' کارت — هر مرحله در هر جهتی که سند گفته، کارت و زمان‌بندی جدا دارد. '+
    'آمادهٔ مرور: <b>'+fa(due)+'</b> · هر دوره '+fa(SESS)+' سؤال.<br>مراحل محکم در همهٔ جهت‌ها: <b>'+
    fa(solid())+' از '+fa(S.length)+'</b></p></div>';
}
function bindSp(){const e=el('sp'); if(e)e.onchange=()=>{stPh=e.value;stInit();};}
function drawSt(){
  let h=stHead();
  if(!stQ.length||stAt>=stQ.length){
    const p=pool(), left=p.filter(c=>dueNow(c.k)).length;
    const nx=Math.min(...p.map(c=>ST.due[c.k]||0).filter(t=>t>Date.now()));
    const ok=stRes.filter(r=>r).length;
    h+='<div class="res"><h2>'+(stRes.length?'پایان دوره':'فعلاً تمام')+'</h2>'+
      (stRes.length?'<div class="big"><span class="k">درست</span><span class="v">'+fa(ok)+' از '+fa(stRes.length)+'</span></div>'
                   :'<div class="big"><span class="k">کارت آماده</span><span class="v">۰</span></div>')+
      '<div class="flag">'+(left?'هنوز <b>'+fa(left)+'</b> کارت آمادهٔ مرور است.'
        :isFinite(nx)?'کارت بعدی '+fa(new Date(nx).toLocaleDateString('fa-IR'))+' برمی‌گردد.':'همه را دیده‌اید.')+'</div></div>';
    if(stMiss.length){
      h+='<div class="card"><h2>اشتباه‌ها — '+fa(stMiss.length)+'</h2>';
      stMiss.forEach(m=>h+='<div class="ck"><div class="bd"><h4>مرحله '+fa(m.g)+' · '+TL[m.t]+'</h4><p>'+m.why+'</p></div></div>');
      h+='</div>';
    }
    h+=(stRes.length?'<button class="btn" id="go">دورهٔ بعد</button>':'')+
       '<button class="btn g" id="rs">صفر کردن پیشرفت این انتخاب</button>';
    V().innerHTML=h;bindSp();
    const g=el('go'); if(g)g.onclick=stInit;
    el('rs').onclick=()=>{pool().forEach(c=>{delete ST.box[c.k];delete ST.due[c.k];});save();stInit();};
    return;
  }
  const c=stCur;
  if(!c){stAt++;stCur=stQ[stAt]?build(stQ[stAt]):null;return drawSt();}
  h+='<div class="card"><h2>سؤال '+fa(stAt+1)+' از '+fa(stQ.length)+
     ' <span style="color:var(--soft);font-weight:600">· '+TL[c.t]+'</span></h2>'+
    '<div style="font-size:14px;font-weight:600;color:var(--soft);margin-bottom:7px">'+c.q+'</div>'+
    (c.s?'<div style="font-size:15.5px;font-weight:700;line-height:1.6">'+c.s+'</div>':'');
  if(stPick<0)h+='<button class="opt" id="sure" style="text-align:center;font-weight:800;'+
    (sure?'border-color:var(--acc);background:var(--wash);color:var(--acc)':'')+'">'+
    (sure?'✓ مطمئنم':'مطمئنم؟ (اختیاری)')+'</button>';
  c.o.forEach((o,k)=>{let cl='opt';
    if(stPick>=0){if(o.ok)cl+=' ok';else if(k===stPick)cl+=' no';}
    h+='<button class="'+cl+'" data-o="'+k+'"'+(stPick>=0?' disabled':'')+'>'+o.t+'</button>';});
  if(stPick>=0)h+='<div class="flag'+(c.o[stPick].ok?'':' bad')+'" style="margin-top:12px">'+c.why+'</div>';
  h+='</div><div class="prog"><i style="width:'+((stAt/stQ.length)*100).toFixed(1)+'%"></i></div>';
  if(stPick>=0)h+='<button class="btn" id="qn">'+(stAt+1>=stQ.length?'نتیجه':'بعدی')+'</button>';
  V().innerHTML=h;bindSp();
  const sb=el('sure'); if(sb)sb.onclick=()=>{sure=!sure;drawSt();};
  V().querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    stPick=+b.dataset.o; const ok=c.o[stPick].ok;
    grade(c.k,ok); ST.stat[c.g]=ST.stat[c.g]||{o:0,x:0}; ST.stat[c.g][ok?'o':'x']++; save();
    stRes.push(ok);
    if(!ok&&sure)stMiss.push({g:c.g,t:c.t,why:c.why,sure:true});
    else if(!ok&&!c.again){stMiss.push({g:c.g,t:c.t,why:c.why});
      stQ.splice(Math.min(stQ.length,stAt+3),0,Object.assign({},c,{again:true}));}
    drawSt();});
  const n=el('qn'); if(n)n.onclick=()=>{stAt++;stPick=-1;sure=false;stCur=stQ[stAt]?build(stQ[stAt]):null;drawSt();};
}

/* ---------- 3. workflow routing, straight from the document ---------- */
let rPh='all';
function rtInit(){
  const list=S.filter(x=>x.flow&&(rPh==='all'||x.ph===+rPh));
  let h='<div class="card"><h2>مسیر گردش کار</h2><select id="rp">'+
    '<option value="all">همهٔ فازها</option>'+
    PH.map(x=>'<option value="'+x.n+'"'+(String(x.n)===rPh?' selected':'')+'>فاز '+fa(x.n)+' · '+x.nm+'</option>').join('')+
    '</select><p class="note">هر سطر همان «مسیر گردش کار» است که خودِ سند برای آن مرحله نوشته. '+
    fa(list.length)+' مرحله از '+fa(S.length)+' مرحله مسیر دارد؛ بقیه در سند مسیری ذکر نشده.</p></div>';
  let last=null;
  list.forEach(x=>{
    if(x.ph!==last){h+='<div class="card"><h2>'+phName(x.ph)+'</h2></div>';last=x.ph;}
    h+='<div class="card"><h2>مرحله '+fa(x.g)+' · '+x.t+'</h2>'+
      '<div class="rn"><span class="wh" style="font-size:13.5px">'+
      x.flow.replace(/←/g,'<span style="color:var(--acc);font-weight:800"> ← </span>')+'</span></div>'+
      (x.who?'<p class="note" style="margin:6px 0 0"><b>مسئول:</b> '+x.who+'</p>':'')+
      (x.out?'<p class="note" style="margin:3px 0 0"><b>خروجی:</b> '+x.out+'</p>':'')+'</div>';
  });
  V().innerHTML=h;
  const e=el('rp'); if(e)e.onchange=()=>{rPh=e.value;rtInit();};
}

/* ---------- 4. forms ---------- */
let fQ=[],fAt=0,fPick=-1,fMode='list';
function fmInit(){
  if(fMode==='drill'){fQ=shuf(G.forms.map((x,i)=>i)).slice(0,10);fAt=0;fPick=-1;}
  drawFm();
}
function drawFm(){
  let h='<div class="card"><h2>۵۰ فرم و مدرک</h2>'+
    '<div class="seg" id="fs" role="group">'+
      [['list','فهرست'],['drill','تمرین']].map(([k,t])=>'<button data-f="'+k+'" aria-pressed="'+(fMode===k)+'">'+t+'</button>').join('')+
    '</div></div>';
  if(fMode==='list'){
    G.forms.forEach(f=>h+='<div class="card"><h2>'+fa(f.n)+' · '+f.t+'</h2>'+
      (f.d?'<p class="note" style="margin:0">'+f.d+'</p>':'')+'</div>');
    V().innerHTML=h;bindFs();return;
  }
  if(fAt>=fQ.length){
    h+='<div class="res"><h2>پایان</h2><div class="flag">ده فرم را یک دور زدید.</div></div>'+
       '<button class="btn" id="fa2">دوباره</button>';
    V().innerHTML=h;bindFs();el('fa2').onclick=fmInit;return;
  }
  const f=G.forms[fQ[fAt]];
  const opts=mkOpts(f.t,G.forms.filter((y,j)=>j!==fQ[fAt]).map(y=>y.t),4);
  if(!drawFm._o||drawFm._at!==fAt){drawFm._o=opts;drawFm._at=fAt;}
  const o=drawFm._o;
  h+='<div class="card"><h2>فرم '+fa(fAt+1)+' از '+fa(fQ.length)+'</h2>'+
    '<div style="font-size:14px;font-weight:600;color:var(--soft);margin-bottom:7px">این توضیح مال کدام فرم است؟</div>'+
    '<div style="font-size:14px;line-height:1.7">'+(f.d||'—').slice(0,320)+'</div>';
  o.forEach((x,k)=>{let cl='opt';
    if(fPick>=0){if(x.ok)cl+=' ok';else if(k===fPick)cl+=' no';}
    h+='<button class="'+cl+'" data-o="'+k+'"'+(fPick>=0?' disabled':'')+'>'+x.t+'</button>';});
  if(fPick>=0)h+='<div class="flag'+(o[fPick].ok?'':' bad')+'" style="margin-top:12px">فرم شماره '+fa(f.n)+'</div>';
  h+='</div>'+(fPick>=0?'<button class="btn" id="fn">بعدی</button>':'');
  V().innerHTML=h;bindFs();
  V().querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{fPick=+b.dataset.o;drawFm();});
  const n=el('fn'); if(n)n.onclick=()=>{fAt++;fPick=-1;drawFm._o=null;drawFm();};
}
function bindFs(){V().querySelectorAll('#fs button').forEach(b=>b.onclick=()=>{fMode=b.dataset.f;fmInit();});}

/* ---------- 5. risks ---------- */
function rkInit(){
  const sev=t=>/بحرانی/.test(t)?'var(--warn)':/بالا/.test(t)?'#8A6D1F':'var(--soft)';
  let h='<div class="card"><h2>۱۸ ریسک و اشتباه رایج</h2>'+
    '<p class="note" style="margin:0">ستون «شدت» از خود سند است: بحرانی یعنی می‌تواند پروژه را متوقف کند.</p></div>';
  G.risks.forEach((r,i)=>{
    h+='<div class="card"><h2 style="color:'+sev(r.sev)+'">'+fa(i+1)+' · '+(r.sev||'—')+'</h2>'+
      '<h4 style="margin:0 0 6px;font-size:14px">'+r.t+'</h4>'+
      (r.stage?'<p class="note" style="margin:0"><b>مرحلهٔ بروز:</b> '+r.stage+'</p>':'')+
      (r.eff?'<p class="note" style="margin:3px 0 0"><b>اثر:</b> '+r.eff+'</p>':'')+
      (r.fix?'<p class="note" style="margin:3px 0 0;color:var(--acc)"><b>اقدام پیشگیرانه:</b> '+r.fix+'</p>':'')+
      (r.law?'<p class="note" style="margin:3px 0 0"><b>مبنا:</b> '+r.law+'</p>':'')+'</div>';
  });
  V().innerHTML=h;
}

/* ---------- 6. checklist ---------- */
function ckCounts(){
  const done=S.filter(x=>ST.ck['g'+x.g]).length;
  const v=el('ckv'),b=el('ckb');
  if(v)v.textContent=fa(done)+' از '+fa(S.length);
  if(b)b.style.width=(done/S.length*100).toFixed(1)+'%';
  PH.forEach(p=>{const ids=byPhase(p.n),d2=ids.filter(x=>ST.ck['g'+x.g]).length;
    const hh=el('ph'+p.n); if(hh)hh.textContent='فاز '+fa(p.n)+' · '+p.nm+' — '+fa(d2)+'/'+fa(ids.length);});
}
function drawCk(){
  const done=S.filter(x=>ST.ck['g'+x.g]).length;
  let h='<div class="res"><h2>پیشرفت پرونده</h2><div class="big"><span class="k">انجام‌شده</span>'+
    '<span class="v" id="ckv">'+fa(done)+' از '+fa(S.length)+'</span></div>'+
    '<div class="prog" style="background:rgba(255,255,255,.25)"><i id="ckb" style="width:'+(done/S.length*100).toFixed(1)+'%;background:#fff"></i></div></div>';
  PH.forEach(p=>{
    const ids=byPhase(p.n), d2=ids.filter(x=>ST.ck['g'+x.g]).length;
    h+='<div class="card"><h2 id="ph'+p.n+'">فاز '+fa(p.n)+' · '+p.nm+' — '+fa(d2)+'/'+fa(ids.length)+'</h2>';
    ids.forEach(x=>{
      const on=!!ST.ck['g'+x.g];
      h+='<div class="ck'+(on?' done':'')+'"><input type="checkbox" data-g="'+x.g+'"'+(on?' checked':'')+
        ' aria-label="مرحله '+fa(x.g)+'"><div class="bd"><h4>'+x.t+'<span class="gi">مرحله '+fa(x.g)+'</span></h4>'+
        FIELDS.filter(([k])=>x[k]).map(([k,lab])=>
          '<p'+(k==='risk'?' class="tr"':'')+'><b>'+lab+':</b> '+x[k]+'</p>').join('')+
        '</div></div>';});
    h+='</div>';
  });
  h+='<button class="btn g" id="cr">پاک کردن همهٔ تیک‌ها</button>';
  V().innerHTML=h;
  V().querySelectorAll('[data-g]').forEach(b=>b.onchange=()=>{
    const k='g'+b.dataset.g;
    if(b.checked)ST.ck[k]=1; else delete ST.ck[k];
    save(); b.closest('.ck').classList.toggle('done',b.checked); ckCounts();});
  el('cr').onclick=()=>{if(confirm('همهٔ تیک‌ها پاک شوند؟')){ST.ck={};save();drawCk();}};
}


/* ---------- flashcards: for learning and review, not for testing ----------
   The mixed drill marks you; these do not have to. "مرور آزاد" leaves the
   spacing data untouched so reading through a phase before a meeting cannot
   quietly push every card out to 21 days. "با زمان‌بندی" is the same deck
   wired into the same schedule as the drill, keyed per card. */
let fcDeck='steps', fcScope='all', fcGraded=false, fcQ=[], fcAt=0, fcFlip=false, fcMore=null;
const DECKS=[['steps','مراحل'],['forms','فرم‌ها'],['risks','ریسک‌ها'],['phases','فازها']];
function fcItems(){
  if(fcDeck==='steps')return S.map((x,i)=>i).filter(i=>fcScope==='all'||S[i].ph===+fcScope);
  if(fcDeck==='forms')return G.forms.map((x,i)=>i);
  if(fcDeck==='risks')return G.risks.map((x,i)=>i);
  return PH.map((x,i)=>i);
}
const fcKey=i=>'f:'+fcDeck+':'+i;
function fcInit(){
  let it=fcItems();
  if(fcGraded)it=it.filter(i=>dueNow(fcKey(i)));
  fcQ=fcGraded?shuf(it):it;      /* free review keeps document order; graded shuffles */
  fcAt=0;fcFlip=false;drawFc();
}
function fcFront(i){
  if(fcDeck==='steps')return '<span class="tag">مرحله '+fa(S[i].g)+' · '+phName(S[i].ph)+'</span><div class="q">'+S[i].t+'</div>';
  if(fcDeck==='forms')return '<span class="tag">فرم '+fa(G.forms[i].n)+' از ۵۰</span><div class="q">'+G.forms[i].t+'</div>';
  if(fcDeck==='risks')return '<span class="tag">ریسک '+fa(i+1)+' · '+(G.risks[i].sev||'—')+'</span><div class="q">'+G.risks[i].t+'</div>';
  return '<span class="tag">فاز '+fa(PH[i].n)+'</span><div class="q">'+PH[i].nm+'</div>';
}
function fcBack(i){
  if(fcDeck==='steps'){
    const x=S[i];
    /* the decision-relevant fields first; the long reference text behind a toggle,
       so the card answers the question instead of reprinting the page */
    const KEY=['who','flow','out','time','pre'], REST=['law','risk','forms','note'];
    const lab=k=>(FIELDS.find(f=>f[0]===k)||[k,k])[1];
    let h=KEY.filter(k=>x[k]).map(k=>'<p style="margin:0 0 7px"><b style="color:var(--acc)">'+lab(k)+':</b> '+x[k]+'</p>').join('');
    const more=REST.filter(k=>x[k]);
    if(more.length){
      const on=fcMore===i;
      h+='<button class="btn g" style="margin-top:8px" data-more="'+i+'">'+(on?'بستن جزئیات':'جزئیات و مبنا')+'</button>'+
         (on?more.map(k=>'<p style="margin:8px 0 0"><b style="color:var(--acc)">'+lab(k)+':</b> '+x[k]+'</p>').join(''):'');
    }
    return h||'<p class="note" style="margin:0">سند برای این مرحله جزئیاتی نیاورده است.</p>';
  }
  if(fcDeck==='forms')return '<p style="margin:0">'+(G.forms[i].d||'—')+'</p>';
  if(fcDeck==='risks'){const r=G.risks[i];
    return [['مرحلهٔ بروز',r.stage],['اثر',r.eff],['شدت',r.sev],['اقدام پیشگیرانه',r.fix],['مبنا',r.law]]
      .filter(z=>z[1]).map(z=>'<p style="margin:0 0 7px"><b style="color:var(--acc)">'+z[0]+':</b> '+z[1]+'</p>').join('');}
  const n=byPhase(PH[i].n);
  return '<p style="margin:0 0 7px"><b style="color:var(--acc)">'+fa(n.length)+' مرحله:</b></p>'+
    n.map(x=>'<p style="margin:0 0 4px">مرحله '+fa(x.g)+' — '+x.t+'</p>').join('');
}
function drawFc(){
  const it=fcItems(), total=it.length;
  let h='<div class="card"><h2>فلش‌کارت</h2>'+
    '<div class="seg" id="fd" role="group" style="margin-bottom:9px">'+
      DECKS.map(([k,t])=>'<button data-d="'+k+'" aria-pressed="'+(fcDeck===k)+'">'+t+'</button>').join('')+'</div>'+
    (fcDeck==='steps'?'<select id="fsc"><option value="all">همهٔ فازها — '+fa(S.length)+'</option>'+
      PH.map(x=>'<option value="'+x.n+'"'+(String(x.n)===fcScope?' selected':'')+'>فاز '+fa(x.n)+' · '+x.nm+' — '+fa(byPhase(x.n).length)+'</option>').join('')+
      '</select>':'')+
    '<div class="seg sm" id="fg" role="group" style="margin-top:9px">'+
      '<button data-g="0" aria-pressed="'+(!fcGraded)+'">مرور آزاد</button>'+
      '<button data-g="1" aria-pressed="'+fcGraded+'">با زمان‌بندی</button></div>'+
    '<p class="note">'+(fcGraded
      ? 'کارت‌ها طبق فاصلهٔ مرور برمی‌گردند و قضاوت شما ثبت می‌شود.'
      : 'ترتیب سند، بدون نمره‌دهی — برای یادگیری اول بار یا مرور قبل از جلسه. چیزی در زمان‌بندی ثبت نمی‌شود.')+
    '</p></div>';
  if(!fcQ.length){
    h+='<div class="res"><h2>کارتی نیست</h2><div class="flag">'+
      (fcGraded?'همهٔ کارت‌های این دسته مرور شده‌اند؛ بعداً برمی‌گردند.':'این دسته خالی است.')+'</div></div>';
    V().innerHTML=h;bindFc();return;
  }
  const i=fcQ[Math.min(fcAt,fcQ.length-1)];
  h+='<div class="fc">'+fcFront(i)+(fcFlip?'<div class="a">'+fcBack(i)+'</div>':'')+'</div>'+
     '<div class="prog"><i style="width:'+(((fcAt+1)/fcQ.length)*100).toFixed(1)+'%"></i></div>'+
     '<p class="note">'+fa(fcAt+1)+' از '+fa(fcQ.length)+(fcGraded?'':' · کل دسته '+fa(total))+'</p>';
  if(!fcFlip)h+='<button class="btn" id="flip">رو برگردان</button>';
  else if(fcGraded)h+='<div class="row2"><button class="btn w" id="again">دوباره</button>'+
    '<button class="btn g" id="hard">سخت بود</button></div>'+
    '<div class="row2"><button class="btn g" id="good">خوب</button><button class="btn" id="easy">آسان</button></div>';
  else h+='<div class="row2"><button class="btn g" id="prev">قبلی</button><button class="btn" id="next">بعدی</button></div>';
  if(!fcGraded&&!fcFlip)h+='<div class="row2"><button class="btn g" id="prev2">قبلی</button><button class="btn g" id="next2">بعدی</button></div>';
  V().innerHTML=h;bindFc();
  const f=el('flip'); if(f)f.onclick=()=>{fcFlip=true;drawFc();};
  const step=d=>{fcAt=(fcAt+d+fcQ.length)%fcQ.length;fcFlip=false;drawFc();};
  ['prev','prev2'].forEach(id=>{const b=el(id); if(b)b.onclick=()=>step(-1);});
  ['next','next2'].forEach(id=>{const b=el(id); if(b)b.onclick=()=>step(1);});
  const g=q=>{LEARN.grade(ST,fcKey(i),q,false);save();fcAt++;fcFlip=false;fcMore=null;
    if(fcAt>=fcQ.length)fcInit();else drawFc();};
  [['again',LEARN.Q.AGAIN],['hard',LEARN.Q.HARD],['good',LEARN.Q.GOOD],['easy',LEARN.Q.EASY]]
    .forEach(([id,q])=>{const b=el(id); if(b)b.onclick=()=>g(q);});
}
function bindFc(){
  V().querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{
    fcMore=fcMore===+b.dataset.more?null:+b.dataset.more;drawFc();});
  V().querySelectorAll('#fd button').forEach(b=>b.onclick=()=>{fcDeck=b.dataset.d;fcMore=null;fcInit();});
  V().querySelectorAll('#fg button').forEach(b=>b.onclick=()=>{fcGraded=b.dataset.g==='1';fcInit();});
  const e=el('fsc'); if(e)e.onchange=()=>{fcScope=e.value;fcInit();};
}


/* ---------- weak points: what the schedule knows that a score does not ----------
   Two lists. "مطمئن بودم و غلط شد" is the dangerous one: a wrong answer you had no
   doubt about is a belief to correct, not a fact to revise. "کارت‌های سخت" are the
   cards that keep lapsing; left alone they eat a session every day. */
function wkInit(){
  const all=DECK.slice();
  const cw=all.filter(c=>LEARN.confWrong(ST,c.k)>0)
    .sort((a,b)=>LEARN.confWrong(ST,b.k)-LEARN.confWrong(ST,a.k));
  const lh=all.filter(c=>LEARN.isLeech(ST,c.k)&&LEARN.confWrong(ST,c.k)===0)
    .sort((a,b)=>LEARN.st(ST,b.k).l-LEARN.st(ST,a.k).l);
  const sm=LEARN.summary(ST,all.map(c=>c.k));
  let h='<div class="card"><h2>نقاط ضعف</h2>'+
    '<div class="boxes"><div>آمادهٔ مرور<b>'+fa(sm.due)+'</b></div>'+
    '<div>مطمئن و غلط<b>'+fa(sm.cw)+'</b></div><div>کارت سخت<b>'+fa(sm.leech)+'</b></div></div>'+
    '<p class="note">«مطمئن بودم و غلط شد» مهم‌تر از نمره است: جایی که شک نداشته‌اید و اشتباه بوده، '+
    'یک باور غلط است نه یک فراموشی. اول این‌ها را درست کنید.</p></div>';
  const row=(c,badge)=>{
    const x=S[c.i], q=build(c);
    return '<div class="card"><h2>'+(x?'مرحله '+fa(x.g):'')+' · '+TL[c.t]+
      ' <span style="color:var(--warn)">'+badge+'</span></h2>'+
      (x?'<h4 style="margin:0 0 6px;font-size:14px">'+x.t+'</h4>':'')+
      (q?'<p class="note" style="margin:0"><b>'+q.q+'</b></p>'+
         '<p class="note" style="margin:4px 0 0;color:var(--acc)"><b>پاسخ:</b> '+
         (q.o.find(o=>o.ok)||{t:'—'}).t+'</p>':'')+
      (x&&x.risk?'<p class="note" style="margin:6px 0 0;color:var(--warn)">'+x.risk+'</p>':'')+'</div>';
  };
  if(cw.length){
    h+='<div class="card"><h2>مطمئن بودید و غلط شد — '+fa(cw.length)+'</h2></div>';
    cw.slice(0,12).forEach(c=>h+=row(c,fa(LEARN.confWrong(ST,c.k))+' بار'));
  }
  if(lh.length){
    h+='<div class="card"><h2>کارت‌های سخت — '+fa(lh.length)+'</h2>'+
      '<p class="note" style="margin:0">چهار بار یا بیشتر لغزیده‌اند. فاصله‌شان کندتر رشد می‌کند تا جا بیفتند.</p></div>';
    lh.slice(0,12).forEach(c=>h+=row(c,fa(LEARN.st(ST,c.k).l)+' لغزش'));
  }
  if(!cw.length&&!lh.length)
    h+='<div class="card"><p class="note" style="margin:0">هنوز چیزی ثبت نشده. چند دوره تمرین بزنید؛ '+
       'هر جا دکمهٔ «مطمئنم» را زده باشید و غلط شود، اینجا می‌آید.</p></div>';
  V().innerHTML=h;
}

function render(){({ph:phInit,st:stInit,rt:rtInit,fm:fmInit,rk:rkInit,fc:fcInit,wk:wkInit,ck:drawCk})[view]();window.scrollTo(0,0);}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');view=b.dataset.v;render();});
render();
(function(){const o=el('offline');
  const say=(t,w)=>{if(o)o.innerHTML='<span class="badge'+(w?' old':'')+'">'+t+'</span>';};
  if(location.protocol==='file:'){say('فایل محلی — همیشه آفلاین');return;}
  if(!('serviceWorker' in navigator)){say('بدون پشتیبانی آفلاین',1);return;}
  navigator.serviceWorker.register('sw.js').then(()=>say('آفلاین آماده است')).catch(()=>say('حالت آفلاین فعال نشد',1));})();

</script>

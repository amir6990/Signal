<script>
/* Shared scheduling and calibration engine.
   Replaces fixed Leitner boxes with a graded, ease-adjusted interval, adds lapse
   tracking so a chronically failed card is treated differently from a new one, and
   records confidence alongside correctness so "sure and wrong" can be surfaced —
   that pairing is where a misconception lives, and a box count cannot show it. */
const LEARN=(function(){
  const DAY=864e5;
  const Q={AGAIN:0,HARD:1,GOOD:2,EASY:3};
  const LEECH=4;                 /* lapses before a card is called out */
  const EASE0=2.3, EMIN=1.3, EMAX=2.9;

  function st(S,k){
    S.c=S.c||{};
    return S.c[k]||(S.c[k]={n:0,i:0,e:EASE0,d:0,l:0,cw:0,ok:0,no:0});
  }
  function due(S,k){return st(S,k).d<=Date.now();}
  function dueIn(S,k){return st(S,k).d;}
  function isLeech(S,k){return st(S,k).l>=LEECH;}
  function confWrong(S,k){return st(S,k).cw;}

  /* q: 0 again, 1 hard, 2 good, 3 easy. conf: true if the learner said they were sure. */
  function grade(S,k,q,conf){
    const c=st(S,k);
    c.n++;
    if(q===Q.AGAIN){
      c.l++; c.ok=c.ok; c.no=(c.no||0)+1;
      if(conf)c.cw=(c.cw||0)+1;          /* sure, and wrong */
      c.e=Math.max(EMIN,c.e-0.2);
      c.i=0;                              /* relearn today */
      c.d=Date.now();
    }else{
      c.ok=(c.ok||0)+1;
      c.e=Math.min(EMAX,c.e+(q===Q.EASY?0.12:q===Q.HARD?-0.14:0.02));
      /* a card that has lapsed repeatedly re-grows more slowly */
      const brake=c.l>=LEECH?0.6:1;
      if(c.i===0)c.i=q===Q.EASY?2:1;
      else if(c.i===1)c.i=q===Q.HARD?2:(q===Q.EASY?5:3);
      else c.i=Math.max(c.i+1,Math.round(c.i*c.e*brake*(q===Q.HARD?0.6:1)));
      c.i=Math.min(c.i,400);
      c.d=Date.now()+c.i*DAY;
    }
    return c;
  }
  /* a coarse bucket, only for the progress strip */
  function bucket(S,k){const i=st(S,k).i;
    return i===0?0:i<=1?1:i<=3?2:i<=10?3:4;}
  function summary(S,keys){
    const b=[0,0,0,0,0]; let leech=0,cw=0,dueN=0;
    keys.forEach(k=>{b[bucket(S,k)]++; if(isLeech(S,k))leech++; if(confWrong(S,k))cw++; if(due(S,k))dueN++;});
    return {b,leech,cw,due:dueN};
  }
  return {Q,DAY,st,due,dueIn,isLeech,confWrong,grade,bucket,summary,LEECH};
})();

</script>
<script src="route.js"></script>
<script>
const FA='۰۱۲۳۴۵۶۷۸۹', fa=s=>String(s).replace(/\d/g,d=>FA[d]);
const el=id=>document.getElementById(id), V=()=>el('view');
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let view='sp';

const KEY='proc_v1', DAY=864e5;
let ST={box:{},due:{},ck:{},rec:{},stat:{},seen:{}};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null'); if(r)ST=Object.assign(ST,r);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}};
const IVL=[0,1,3,7,21];
ST.c=ST.c||{};
const boxOf=k=>LEARN.bucket(ST,k), dueNow=k=>LEARN.due(ST,k);
let sure=false;
const grade=(k,ok)=>{LEARN.grade(ST,k,ok?LEARN.Q.GOOD:LEARN.Q.AGAIN,sure);save();};

/* flat step list with global گام numbers */
const FLAT=[]; P.stages.forEach((s,si)=>s.steps.forEach(x=>FLAT.push(Object.assign({si,g:FLAT.length+1},x))));

/* ---------- ordering drill, reused for spine and stages ---------- */
let drill='sp', placed=[], pool=[], done=false;
const drillItems=()=>drill==='sp'?P.spine.map((t,i)=>({t,d:''}))
  :P.stages.map((s,i)=>({t:s.name,d:s.c}));
function dInit(){placed=[];done=false;pool=shuf(drillItems().map((x,i)=>i));drawD();}
function drawD(){
  const items=drillItems(), N=items.length, rk='rec_'+drill;
  let h='<div class="card"><h2>ترتیب را بسازید</h2>'+
    '<div class="seg" id="dsw" role="group" style="margin-bottom:11px">'+
      '<button data-d="sp" aria-pressed="'+(drill==='sp')+'">شش ضرب اصلی</button>'+
      '<button data-d="stg" aria-pressed="'+(drill==='stg')+'">هشت مرحله</button></div>'+
    '<div class="spine">'+P.spine.map((x,i)=>(i?'<i>←</i>':'')+'<span>'+(drill==='sp'&&!done?'؟':x)+'</span>').join('')+'</div>'+
    '<p class="note">'+(drill==='sp'
      ? 'هر کاری در فاز ۲ روی یکی از این شش ضرب می‌نشیند. وقتی گم شدید، اول بپرسید روی کدام ضرب هستید.'
      : 'هشت مرحلهٔ فاز ۲ را به ترتیب بچینید.')+
    ((ST.rec[rk]||0)?' بهترین رکورد: <b>'+fa(ST.rec[rk])+' از '+fa(N)+'</b>.':'')+'</p></div>';

  h+='<div class="card"><h2>ترتیب شما</h2>';
  if(!placed.length)h+='<p class="note" style="margin:0">هنوز چیزی انتخاب نکرده‌اید.</p>';
  placed.forEach((ix,k)=>{
    const ok=ix===k;
    h+='<button class="slot'+(done?(ok?' ok':' no'):'')+'" disabled><span class="num">'+fa(k+1)+'</span><span>'+
       items[ix].t+(done&&!ok?' — جای درستش '+fa(ix+1):'')+'</span></button>';
    if(done&&items[ix].d)h+='<div class="det">'+items[ix].d+'</div>';
  });
  h+='</div>';
  if(pool.length){
    h+='<div class="card"><h2>شمارهٔ '+fa(placed.length+1)+' کدام است؟</h2>';
    pool.forEach(ix=>h+='<button class="slot pick" data-p="'+ix+'"><span class="num">؟</span><span>'+items[ix].t+'</span></button>');
    h+='</div>';
  }else{
    const right=placed.filter((ix,k)=>ix===k).length;
    h+='<div class="res"><h2>نتیجه</h2><div class="big"><span class="k">درست</span><span class="v">'+
      fa(right)+' از '+fa(N)+'</span></div>'+
      (right===N?'<div class="flag">کامل درست.</div>':'<div class="flag bad">جاهای قرمز را ببینید.</div>')+'</div>'+
      '<button class="btn" id="again">دوباره</button>';
  }
  V().innerHTML=h;
  V().querySelectorAll('#dsw button').forEach(b=>b.onclick=()=>{drill=b.dataset.d;dInit();});
  V().querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    placed.push(+b.dataset.p); pool=pool.filter(x=>x!==+b.dataset.p);
    if(!pool.length){done=true;
      const r=placed.filter((ix,k)=>ix===k).length, rk='rec_'+drill;
      if(r>(ST.rec[rk]||0)){ST.rec[rk]=r;save();}}
    drawD();});
  const a=el('again'); if(a)a.onclick=dInit;
}

/* ---------- گام‌ها: a mixed, auto-graded drill ----------
   Scheduling is per question *direction*, not per step. Getting "which stage"
   right says nothing about whether you know the trap, so one right answer must
   not retire the whole step for a day — that was how a step could look learned
   while one of its facets had never been asked.
   Every generator refuses to build a question the data cannot support fairly:
   six steps share the output "طبقه‌بندی در مستندات", so neither direction of the
   output question is asked about them — otherwise it is a free mark. What does
   distinguish those six is which of the two confusable sets they belong to, so
   that is asked directly. */
const splitOut=o=>{
  if(o.indexOf('خروجی:')<0)return{a:'',o:o,d:''};
  let[a,b]=o.split('خروجی:'); b=b.trim().replace(/^·\s*/,'');
  const m=b.match(/·\s*([۰-۹]+\s*روز)\s*$/); let d='';
  if(m){d=m[1];b=b.slice(0,m.index).trim().replace(/·\s*$/,'').trim();}
  return{a:a.trim().replace(/·\s*$/,'').trim(),o:b,d:d};
};
FLAT.forEach(x=>{const z=splitOut(x.o);x.act=z.a;x.out=z.o;x.dur=z.d;});
const OUTCOUNT={}; FLAT.forEach(x=>OUTCOUNT[x.out]=(OUTCOUNT[x.out]||0)+1);
const UNIQOUT=i=>OUTCOUNT[FLAT[i].out]===1;
const TRAPIX=FLAT.map((x,i)=>i).filter(i=>FLAT[i].p);
const PLAINIX=FLAT.map((x,i)=>i).filter(i=>!FLAT[i].opt);
/* the two sets people mix up, taken from the stage names themselves */
const SETS=P.stages.map((s,si)=>({si,nm:s.name,ix:FLAT.map((x,i)=>i).filter(i=>FLAT[i].si===si)}))
  .filter(s=>/^چهار /.test(s.nm));
const SETPOOL=SETS.reduce((a,s)=>a.concat(s.ix),[]);

const mkOpts=(correct,poolTexts,n)=>{
  const seen=new Set([correct]), ds=[];
  shuf(poolTexts.slice()).forEach(t=>{if(ds.length<n-1&&!seen.has(t)){seen.add(t);ds.push(t);}});
  return shuf([{t:correct,ok:true}].concat(ds.map(t=>({t,ok:false}))));
};
const chain=i=>{
  const a=FLAT[i-1], x=FLAT[i], b=FLAT[i+1];
  return (a?'گام '+fa(a.g)+' '+a.t+' ← ':'')+'<b>گام '+fa(x.g)+' '+x.t+'</b>'+
         (b?' ← گام '+fa(b.g)+' '+b.t:'');
};
/* which directions each step can be asked in */
const CAN={
  out:i=>UNIQOUT(i), rev:i=>UNIQOUT(i), stage:i=>true,
  next:i=>i+1<FLAT.length, trap:i=>!!FLAT[i].p, cond:i=>!!FLAT[i].opt
};
const TYPES=['out','rev','stage','next','trap','cond'];
const TL={out:'خروجی',rev:'گام از خروجی',stage:'مرحله',next:'گام بعدی',trap:'تله',cond:'حسب مورد',set:'عضویت در گروه'};

const GEN={
  out:c=>{const i=c.i,x=FLAT[i];
    return {q:'خروجی این گام چیست؟',s:x.t,
      o:mkOpts(x.out,FLAT.filter((y,j)=>j!==i&&UNIQOUT(j)).map(y=>y.out),4),
      why:'گام '+fa(x.g)+' · '+P.stages[x.si].name+(x.dur?' · '+x.dur:'')};},
  rev:c=>{const i=c.i,x=FLAT[i];
    return {q:'این خروجی از کدام گام می‌آید؟',s:x.out,
      o:mkOpts(x.t,FLAT.filter((y,j)=>j!==i).map(y=>y.t),4),
      why:'گام '+fa(x.g)+' · '+P.stages[x.si].name};},
  stage:c=>{const i=c.i,x=FLAT[i];
    return {q:'این گام در کدام مرحله است؟',s:x.t,
      o:mkOpts(P.stages[x.si].name,P.stages.filter((st,k)=>k!==x.si).map(st=>st.name),4),
      why:'گام '+fa(x.g)+' از ۳۱ · '+P.stages[x.si].n};},
  next:c=>{const i=c.i,x=FLAT[i],nx=FLAT[i+1];
    return {q:'بعد از این گام، گام بعدی چیست؟',s:x.t,
      o:mkOpts(nx.t,FLAT.filter((y,j)=>j!==i+1&&j!==i).map(y=>y.t),4),
      why:chain(i)+(x.si!==nx.si?'<br>اینجا وارد «'+P.stages[nx.si].name+'» می‌شوید.':'')};},
  trap:c=>{const i=c.i,x=FLAT[i];
    return {q:'تلهٔ این گام کدام است؟',s:x.t,
      o:mkOpts(x.p,TRAPIX.filter(j=>j!==i).map(j=>FLAT[j].p),4),
      why:'گام '+fa(x.g)+' · '+x.t};},
  cond:c=>{const i=c.i,x=FLAT[i];
    return {q:'کدام‌یک «حسب مورد» است، نه الزامی؟',s:'',
      o:mkOpts(x.t,shuf(PLAINIX.slice()).map(j=>FLAT[j].t),4),
      why:'گام '+fa(x.g)+' حسب مورد است. سه گام حسب مورد داریم: '+
        FLAT.filter(y=>y.opt).map(y=>y.t).join(' · ')};},
  /* multi-select: pick exactly the members of one set out of both sets pooled */
  set:c=>{const S=SETS[c.s];
    return {multi:true,q:'کدام‌ها «'+S.nm+'» هستند؟ هر چهار مورد را انتخاب کنید.',s:'',
      o:shuf(SETPOOL.map(j=>({t:FLAT[j].t,ok:S.ix.indexOf(j)>=0}))),
      why:S.nm+': '+S.ix.map(j=>FLAT[j].t).join(' · ')};}
};

/* the card deck: one card per (step, direction), plus one per confusable set */
const DECK=[];
FLAT.forEach((x,i)=>TYPES.forEach(t=>{if(CAN[t](i))DECK.push({k:'c'+x.g+':'+t,t,i,g:x.g,si:x.si});}));
SETS.forEach((S,si)=>DECK.push({k:'cset:'+S.si,t:'set',s:si,i:-1,g:0,si:S.si}));

const SESS=12;
let stMode='mix', stStage='all', stQ=[], stAt=0, stPick=-1, stSel=[], stCur=null, stShow=false, stRes=[], stMiss=[];
function deckPool(){return DECK.filter(c=>stStage==='all'||c.si===+stStage);}
function stPool(){return FLAT.map((x,i)=>i).filter(i=>stStage==='all'||FLAT[i].si===+stStage);}
/* a step counts as solid when every direction it can be asked in is at 3 days or more */
function solidCount(){
  let n=0;
  FLAT.forEach((x,i)=>{const ks=TYPES.filter(t=>CAN[t](i)).map(t=>'c'+x.g+':'+t);
    if(ks.length&&ks.every(k=>boxOf(k)>=2))n++;});
  return n;
}
function stInit(){
  if(stMode==='ord'){ordInit();return;}
  if(stMode==='weak'){drawWeak();return;}
  if(stMode==='full'){
    stQ=shuf(stPool().filter(i=>dueNow('s'+i))).map(i=>({full:true,i}));
    stAt=0;stShow=false;stRes=[];stMiss=[];stCur=stQ[0]||null;drawSt();return;
  }
  const due=deckPool().filter(c=>dueNow(c.k));
  stQ=shuf(due).slice(0,SESS);
  stAt=0;stPick=-1;stSel=[];stRes=[];stMiss=[];
  stCur=stQ[0]?build(stQ[0]):null;
  drawSt();
}
function build(c){const q=GEN[c.t](c);return q?Object.assign({},c,q):null;}

/* per-step tally feeding the "ضعیف‌ها" view, and a per-direction tally so that
   view can say which way round a step keeps failing */
function bumpSeen(g,t,ok){
  ST.seen=ST.seen||{}; const k=g+':'+t, r=ST.seen[k]||{o:0,x:0};
  if(ok)r.o++;else r.x++; ST.seen[k]=r; save();
}
function statOf(g){return ST.stat&&ST.stat[g]||{o:0,x:0};}
function bump(g,ok){ST.stat=ST.stat||{};const st=ST.stat[g]||{o:0,x:0};
  if(ok)st.o++;else st.x++;ST.stat[g]=st;save();}

function stHead(){
  const pool=deckPool(), due=pool.filter(c=>dueNow(c.k)).length;
  const cnt=[0,0,0,0,0]; pool.forEach(c=>cnt[boxOf(c.k)]++);
  const sc=solidCount();
  return '<div class="card"><h2>گام‌ها</h2>'+
   '<div class="seg" id="sm" role="group" style="margin-bottom:10px">'+
    [['mix','تمرین ترکیبی'],['ord','ترتیب درون مرحله'],['full','کارت کامل'],['weak','ضعیف‌ها']]
      .map(([k,t])=>'<button data-m="'+k+'" aria-pressed="'+(stMode===k)+'">'+t+'</button>').join('')+
   '</div><select id="ss">'+
    '<option value="all">همه — '+fa(FLAT.length)+' گام</option>'+
    P.stages.map((st,i)=>'<option value="'+i+'"'+(String(i)===stStage?' selected':'')+'>'+
      st.n+' · '+st.name+' — '+fa(st.steps.length)+'</option>').join('')+
   '</select>'+
   (stMode==='mix'
     ? '<div class="boxes">'+['تازه','۱ روز','۳ روز','۷ روز','۲۱ روز']
         .map((n,i)=>'<div>'+n+'<b>'+fa(cnt[i])+'</b></div>').join('')+'</div>'+
       '<p class="note">شمارش روی <b>'+fa(pool.length)+' کارت</b> است، نه '+fa(stPool().length)+
       ' گام: هر گام در هر جهتی که بشود پرسید، کارت جداگانه و زمان‌بندی جداگانه دارد. '+
       'آمادهٔ مرور: <b>'+fa(due)+'</b> · هر دوره '+fa(SESS)+' سؤال.'+
       '<br>گام‌های محکم در همهٔ جهت‌ها: <b>'+fa(sc)+' از '+fa(FLAT.length)+'</b></p>'
     : stMode==='full'
     ? '<p class="note">کارت کامل برای بازگویی آزاد — خودتان قضاوت می‌کنید، پس برای مرور عمیق است نه سنجش. '+
       'زمان‌بندی این حالت جداست و روی تمرین ترکیبی اثر نمی‌گذارد.</p>'
     : '')+
   '</div>';
}
function bindHead(){
  V().querySelectorAll('#sm button').forEach(b=>b.onclick=()=>{stMode=b.dataset.m;stInit();});
  const e=el('ss'); if(e)e.onchange=()=>{stStage=e.value;stInit();};
}

function drawSt(){
  let h=stHead();

  /* ----- free-recall mode keeps its own schedule, keyed per step ----- */
  if(stMode==='full'){
    if(stAt>=stQ.length){
      h+='<div class="res"><h2>پایان</h2><div class="flag">کارت‌های این انتخاب تمام شد.</div></div>';
      V().innerHTML=h;bindHead();return;
    }
    const i=stQ[stAt].i, x=FLAT[i];
    h+='<div class="fc"><span class="tag">گام '+fa(x.g)+' · '+P.stages[x.si].name+'</span>'+
      (x.opt?'<span class="tag c" style="margin-inline-start:5px">'+x.opt+'</span>':'')+
      '<div class="q">'+x.t+'</div>'+
      (stShow?'<div class="a">'+(x.act?x.act+'<br>':'')+'<b>خروجی:</b> '+x.out+
        (x.dur?' <span style="color:var(--soft)">· '+x.dur+'</span>':'')+
        (x.p?'<div style="margin-top:9px;color:var(--warn);font-weight:600">تله · '+x.p+'</div>':'')+'</div>':'')+
      '</div><div class="prog"><i style="width:'+((stAt/stQ.length)*100).toFixed(1)+'%"></i></div>'+
      '<p class="note">'+fa(stAt+1)+' از '+fa(stQ.length)+'</p>'+
      (stShow?'<div class="row2"><button class="btn w" id="fg0">نمی‌دانستم</button><button class="btn g" id="fg1">سخت بود</button></div>'+
              '<div class="row2"><button class="btn g" id="fg2">خوب</button><button class="btn" id="fg3">آسان</button></div>'
             :'<button class="btn" id="show">رو برگردان</button>');
    V().innerHTML=h;bindHead();
    const sh=el('show'); if(sh)sh.onclick=()=>{stShow=true;drawSt();};
    const go=q=>{LEARN.grade(ST,'s'+i,q,false);save();bump(x.g,q!==LEARN.Q.AGAIN);
      stAt++;stShow=false;drawSt();};
    [['fg0',LEARN.Q.AGAIN],['fg1',LEARN.Q.HARD],['fg2',LEARN.Q.GOOD],['fg3',LEARN.Q.EASY]]
      .forEach(([id,q])=>{const b2=el(id); if(b2)b2.onclick=()=>go(q);});
    return;
  }

  /* ----- end of a session: say what was missed and why ----- */
  if(!stQ.length||stAt>=stQ.length){
    const pool=deckPool();
    const nx=Math.min(...pool.map(c=>ST.due[c.k]||0).filter(t=>t>Date.now()));
    const left=pool.filter(c=>dueNow(c.k)).length;
    const ok=stRes.filter(r=>r).length;
    h+='<div class="res"><h2>'+(stRes.length?'پایان دوره':'فعلاً تمام')+'</h2>'+
      (stRes.length
        ? '<div class="big"><span class="k">درست</span><span class="v">'+fa(ok)+' از '+fa(stRes.length)+'</span></div>'
        : '<div class="big"><span class="k">کارت آمادهٔ مرور</span><span class="v">۰</span></div>')+
      '<div class="flag">'+(left
        ? 'هنوز <b>'+fa(left)+'</b> کارت آمادهٔ مرور است.'
        : isFinite(nx)
          ? 'کارت بعدی '+fa(new Date(nx).toLocaleDateString('fa-IR'))+' برمی‌گردد.'
          : 'همهٔ کارت‌ها را دیده‌اید.')+'</div></div>';
    if(stMiss.length){
      h+='<div class="card"><h2>این‌ها را اشتباه زدید — '+fa(stMiss.length)+'</h2>'+
        '<p class="note" style="margin:0 0 6px">هر کدام همین حالا با فاصلهٔ صفر برگشته‌اند، پس در دورهٔ بعد باز می‌آیند.</p>';
      stMiss.forEach(m=>{
        h+='<div class="ck"><div class="bd"><h4>'+(m.g?'گام '+fa(m.g)+' · ':'')+TL[m.t]+'</h4>'+
          '<p>'+m.why+'</p></div></div>';});
      h+='</div>';
    }
    h+=(stRes.length?'<button class="btn" id="go">دورهٔ بعد</button>':'')+
       '<button class="btn g" id="rs">صفر کردن پیشرفت این انتخاب</button>';
    V().innerHTML=h;bindHead();
    const go=el('go'); if(go)go.onclick=stInit;
    const r=el('rs'); if(r)r.onclick=()=>{deckPool().forEach(c=>{delete ST.box[c.k];delete ST.due[c.k];});save();stInit();};
    return;
  }

  const c=stCur;
  if(!c){stAt++;stCur=stQ[stAt]?build(stQ[stAt]):null;return drawSt();}

  h+='<div class="card"><h2>سؤال '+fa(stAt+1)+' از '+fa(stQ.length)+
     ' <span style="color:var(--soft);font-weight:600">· '+TL[c.t]+'</span></h2>'+
    '<div style="font-size:14px;font-weight:600;color:var(--soft);margin-bottom:7px">'+c.q+'</div>'+
    (c.s?'<div style="font-size:16px;font-weight:700;line-height:1.6">'+c.s+'</div>':'');

  if(stPick<0&&!c.multi)h+='<button class="opt" id="sure" style="text-align:center;font-weight:800;'+
    (sure?'border-color:var(--acc);background:var(--wash);color:var(--acc)':'')+'">'+
    (sure?'✓ مطمئنم':'مطمئنم؟ (اختیاری)')+'</button>';
  if(c.multi){
    c.o.forEach((o,k)=>{let cl='opt';
      if(stPick>=0){ if(o.ok)cl+=' ok'; else if(stSel.indexOf(k)>=0)cl+=' no'; }
      else if(stSel.indexOf(k)>=0)cl+=' ok';
      h+='<button class="'+cl+'" data-s="'+k+'"'+(stPick>=0?' disabled':'')+'>'+o.t+'</button>';});
    if(stPick<0)h+='<button class="btn'+(stSel.length?'':' g')+'" id="chk">بررسی ('+fa(stSel.length)+' انتخاب)</button>';
  }else{
    c.o.forEach((o,k)=>{let cl='opt';
      if(stPick>=0){if(o.ok)cl+=' ok';else if(k===stPick)cl+=' no';}
      h+='<button class="'+cl+'" data-o="'+k+'"'+(stPick>=0?' disabled':'')+'>'+o.t+'</button>';});
  }
  if(stPick>=0)h+='<div class="flag'+(stRes[stRes.length-1]?'':' bad')+'" style="margin-top:12px">'+c.why+'</div>';
  h+='</div><div class="prog"><i style="width:'+((stAt/stQ.length)*100).toFixed(1)+'%"></i></div>';
  if(stPick>=0)h+='<button class="btn" id="qn">'+(stAt+1>=stQ.length?'نتیجه':'بعدی')+'</button>';
  V().innerHTML=h;bindHead();
  const sb=el('sure'); if(sb)sb.onclick=()=>{sure=!sure;drawSt();};

  const settle=ok=>{
    grade(c.k,ok);
    if(c.g){bump(c.g,ok);bumpSeen(c.g,c.t,ok);}
    stRes.push(ok);
    if(!ok){
      if(!c.again)stMiss.push({g:c.g,t:c.t,why:c.why});
      /* see it again before the session ends, not tomorrow — but only one retry
         per card, or a session you keep failing never reaches its end */
      if(!c.again){
        const at=Math.min(stQ.length,stAt+3);
        stQ.splice(at,0,Object.assign({},c,{again:true}));
      }
    }
  };
  V().querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    stPick=+b.dataset.o; settle(c.o[stPick].ok); drawSt();});
  V().querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.s, at=stSel.indexOf(k);
    if(at>=0)stSel.splice(at,1); else stSel.push(k);
    drawSt();});
  const ch=el('chk'); if(ch)ch.onclick=()=>{
    const want=c.o.map((o,k)=>o.ok?k:-1).filter(k=>k>=0);
    const ok=want.length===stSel.length&&want.every(k=>stSel.indexOf(k)>=0);
    stPick=0; settle(ok); drawSt();};
  const n=el('qn'); if(n)n.onclick=()=>{
    stAt++;stPick=-1;stSel=[];sure=false;
    stCur=stQ[stAt]?build(stQ[stAt]):null;
    drawSt();};
}

/* within-stage ordering: the order inside a stage matters too */
let oSi=0, oPlaced=[], oPool=[], oDone=false;
function ordInit(){
  oSi=stStage==='all'?0:+stStage;
  oPlaced=[];oDone=false;
  oPool=shuf(P.stages[oSi].steps.map((x,i)=>i));
  drawOrd();
}
function drawOrd(){
  const st=P.stages[oSi], N=st.steps.length, rk='ord'+oSi;
  let h=stHead();
  h+='<div class="card"><h2>'+st.n+' · '+st.name+'</h2>'+
    '<p class="note" style="margin:0">گام‌های این مرحله را به ترتیب بچینید.'+
    ((ST.rec[rk]||0)?' بهترین رکورد: <b>'+fa(ST.rec[rk])+' از '+fa(N)+'</b>.':'')+'</p></div>';
  h+='<div class="card"><h2>ترتیب شما</h2>';
  if(!oPlaced.length)h+='<p class="note" style="margin:0">هنوز چیزی انتخاب نکرده‌اید.</p>';
  oPlaced.forEach((ix,k)=>{const ok=ix===k;
    h+='<button class="slot'+(oDone?(ok?' ok':' no'):'')+'" disabled><span class="num">'+fa(k+1)+
      '</span><span>'+st.steps[ix].t+(oDone&&!ok?' — جای درستش '+fa(ix+1):'')+'</span></button>';
    if(oDone){const z=splitOut(st.steps[ix].o);
      h+='<div class="det"><b>خروجی:</b> '+z.o+'</div>';}});
  h+='</div>';
  if(oPool.length){
    h+='<div class="card"><h2>گام '+fa(oPlaced.length+1)+' این مرحله کدام است؟</h2>';
    oPool.forEach(ix=>h+='<button class="slot pick" data-p="'+ix+'"><span class="num">؟</span><span>'+
      st.steps[ix].t+'</span></button>');
    h+='</div>';
  }else{
    const right=oPlaced.filter((ix,k)=>ix===k).length;
    h+='<div class="res"><h2>نتیجه</h2><div class="big"><span class="k">درست</span><span class="v">'+
      fa(right)+' از '+fa(N)+'</span></div>'+
      (right===N?'<div class="flag">کامل درست.</div>':'<div class="flag bad">جاهای قرمز را ببینید.</div>')+'</div>';
    const nxt=oSi+1<P.stages.length?'<button class="btn" id="onext">مرحلهٔ بعد</button>':'';
    h+='<button class="btn g" id="oagain">همین مرحله دوباره</button>'+nxt;
  }
  V().innerHTML=h;bindHead();
  V().querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    oPlaced.push(+b.dataset.p);oPool=oPool.filter(x=>x!==+b.dataset.p);
    if(!oPool.length){oDone=true;
      const r=oPlaced.filter((ix,k)=>ix===k).length;
      if(r>(ST.rec['ord'+oSi]||0)){ST.rec['ord'+oSi]=r;save();}}
    drawOrd();});
  const a=el('oagain'); if(a)a.onclick=ordInit;
  const nb=el('onext'); if(nb)nb.onclick=()=>{oSi++;stStage=String(oSi);oPlaced=[];oDone=false;
    oPool=shuf(P.stages[oSi].steps.map((x,i)=>i));drawOrd();};
}

/* weak items: what you actually keep getting wrong */
function drawWeak(){
  let h=stHead();
  const rows=FLAT.map(x=>({x,s:statOf(x.g)}))
    .filter(r=>r.s.x>0)
    .sort((a,b)=>(b.s.x-b.s.o)-(a.s.x-a.s.o)||b.s.x-a.s.x);
  if(!rows.length){
    h+='<div class="card"><p class="note" style="margin:0">هنوز غلطی ثبت نشده. '+
      'چند دور «تمرین ترکیبی» بزنید؛ هر گامی که اشتباه جواب بدهید اینجا با متن کاملش می‌آید.</p></div>';
    V().innerHTML=h;bindHead();return;
  }
  h+='<div class="card"><h2>ضعیف‌ترین گام‌ها — '+fa(rows.length)+'</h2>'+
    '<p class="note" style="margin:0 0 4px">به ترتیب بیشترین غلط. متن کامل هر گام زیرش آمده.</p></div>';
  rows.slice(0,12).forEach(r=>{
    const x=r.x;
    h+='<div class="card"><h2>گام '+fa(x.g)+' · '+P.stages[x.si].name+' — '+
      '<span style="color:var(--warn)">'+fa(r.s.x)+' غلط</span> / '+fa(r.s.o)+' درست</h2>'+
      '<h4 style="margin:0 0 6px;font-size:14px">'+x.t+(x.opt?'<span class="cond">'+x.opt+'</span>':'')+'</h4>'+
      (x.act?'<p class="note" style="margin:0">'+x.act+'</p>':'')+
      '<p class="note" style="margin:4px 0 0"><b>خروجی:</b> '+x.out+(x.dur?' · '+x.dur:'')+'</p>'+
      (x.p?'<p class="note" style="margin:6px 0 0;color:var(--warn)">تله · '+x.p+'</p>':'')+
      (function(){const f=TYPES.filter(t=>{const r=(ST.seen||{})[x.g+':'+t];return r&&r.x>0;}).map(t=>TL[t]);
        return f.length?'<p class="note" style="margin:6px 0 0">در این جهت‌ها غلط داده‌اید: <b>'+f.join(' · ')+'</b></p>':'';})()+
      '</div>';
  });
  h+='<button class="btn g" id="wr">پاک کردن آمار غلط‌ها</button>';
  V().innerHTML=h;bindHead();
  el('wr').onclick=()=>{ST.stat={};ST.seen={};save();drawWeak();};
}

/* ---------- traps: which step does this trap belong to? ---------- */
let tQ=[], tAt=0, tPick=-1, tOpts=[];
function tInit(){tQ=shuf(P.traps.map((x,i)=>i));tAt=0;tPick=-1;mkT();drawT();}
function mkT(){
  const t=P.traps[tQ[tAt]]; if(!t){tOpts=[];return;}
  const wrong=shuf(P.traps.map((x,i)=>i).filter(i=>i!==tQ[tAt])).slice(0,3);
  tOpts=shuf([{t:t.t,ok:true}].concat(wrong.map(i=>({t:P.traps[i].t,ok:false}))));
}
function drawT(){
  if(tAt>=tQ.length){
    V().innerHTML='<div class="res"><h2>تمام شد</h2><div class="flag">ده تلهٔ اجرایی را یک دور زدید. '+
      'برای تمرین دوباره بزنید؛ هر بار گزینه‌ها جابه‌جا می‌شوند.</div></div>'+
      '<button class="btn" id="ta">دوباره</button>';
    el('ta').onclick=tInit;return;
  }
  const t=P.traps[tQ[tAt]];
  let h='<div class="card"><h2>تلهٔ '+fa(tAt+1)+' از '+fa(tQ.length)+'</h2>'+
    '<div style="font-size:14.5px;font-weight:600;line-height:1.7">'+t.d+'</div>'+
    '<p class="note">این توضیح، کدام تله است؟</p>';
  tOpts.forEach((o,k)=>{let c='opt';
    if(tPick>=0){if(o.ok)c+=' ok';else if(k===tPick)c+=' no';}
    h+='<button class="'+c+'" data-o="'+k+'"'+(tPick>=0?' disabled':'')+'>'+o.t+'</button>';});
  h+='</div><div class="prog"><i style="width:'+((tAt/tQ.length)*100).toFixed(1)+'%"></i></div>';
  if(tPick>=0)h+='<button class="btn" id="tn">'+(tAt+1>=tQ.length?'پایان':'بعدی')+'</button>';
  V().innerHTML=h;
  V().querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{tPick=+b.dataset.o;drawT();});
  const n=el('tn'); if(n)n.onclick=()=>{tAt++;tPick=-1;mkT();drawT();};
}

/* ---------- numeric hooks ---------- */
let nQ=[], nAt=0, nPick=-1, nOpts=[];
function nInit(){nQ=shuf(P.hooks.map((x,i)=>i));nAt=0;nPick=-1;mkN();drawN();}
function mkN(){
  const hk=P.hooks[nQ[nAt]]; if(!hk){nOpts=[];return;}
  const n=parseInt(hk.n.replace(/[۰-۹]/g,d=>FA.indexOf(d)),10);
  const cand=new Set([n]); let add=1;
  while(cand.size<4){cand.add(Math.max(1,n+add));cand.add(Math.max(1,n-add));add++;}
  nOpts=shuf([...cand].slice(0,4).map(v=>({v,ok:v===n})));
  if(!nOpts.some(o=>o.ok)){nOpts[0]={v:n,ok:true};nOpts=shuf(nOpts);}
}
function drawN(){
  if(nAt>=nQ.length){
    let h='<div class="res"><h2>هفت قلاب عددی</h2><div class="flag">'+
      'اگر این هفت عدد را بدانید، فهرست مدارک را بدون نگاه کردن به چک‌لیست بازسازی می‌کنید.</div></div>'+
      '<div class="card"><h2>مرور</h2>';
    P.hooks.forEach(hk=>h+='<div class="hk"><b>'+hk.n+'</b><div><strong>'+hk.k+'</strong><small>'+hk.d+'</small></div></div>');
    h+='</div><button class="btn" id="na">دوباره</button>';
    V().innerHTML=h;el('na').onclick=nInit;return;
  }
  const hk=P.hooks[nQ[nAt]];
  let h='<div class="card"><h2>عدد '+fa(nAt+1)+' از '+fa(nQ.length)+'</h2>'+
    '<div style="font-size:16px;font-weight:700;line-height:1.6">چند '+hk.k+'؟</div>';
  nOpts.forEach((o,k)=>{let c='opt';
    if(nPick>=0){if(o.ok)c+=' ok';else if(k===nPick)c+=' no';}
    h+='<button class="'+c+'" data-o="'+k+'"'+(nPick>=0?' disabled':'')+' style="text-align:center;font-size:17px;font-weight:800">'+fa(o.v)+'</button>';});
  if(nPick>=0)h+='<div class="flag'+(nOpts[nPick].ok?'':' bad')+'" style="margin-top:12px">'+hk.d+'</div>';
  h+='</div><div class="prog"><i style="width:'+((nAt/nQ.length)*100).toFixed(1)+'%"></i></div>';
  if(nPick>=0)h+='<button class="btn" id="nn">'+(nAt+1>=nQ.length?'مرور همه':'بعدی')+'</button>';
  V().innerHTML=h;
  V().querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{nPick=+b.dataset.o;drawN();});
  const n=el('nn'); if(n)n.onclick=()=>{nAt++;nPick=-1;mkN();drawN();};
}

/* ---------- live checklist, doubles as the reference ---------- */
function drawC(){
  const tot=FLAT.length, dn=FLAT.filter((x,i)=>ST.ck['g'+(i+1)]).length;
  let h='<div class="res"><h2>پیشرفت پرونده</h2><div class="big"><span class="k">انجام‌شده</span>'+
    '<span class="v" id="ckv">'+fa(dn)+' از '+fa(tot)+'</span></div>'+
    '<div class="prog" style="background:rgba(255,255,255,.25)"><i id="ckb" style="width:'+(dn/tot*100).toFixed(1)+'%;background:#fff"></i></div>'+
    '<div id="ckf">'+(dn===tot?'<div class="flag">هر '+fa(tot)+' گام تیک خورده است.</div>':'')+'</div></div>';
  P.stages.forEach((s,si)=>{
    const ids=FLAT.filter(x=>x.si===si);
    const sd=ids.filter(x=>ST.ck['g'+x.g]).length;
    h+='<div class="card"><h2 id="sh'+si+'">'+s.n+' · '+s.name+' — '+fa(sd)+'/'+fa(ids.length)+'</h2>';
    ids.forEach(x=>{
      const on=!!ST.ck['g'+x.g];
      h+='<div class="ck'+(on?' done':'')+'"><input type="checkbox" data-g="'+x.g+'"'+(on?' checked':'')+
        ' aria-label="گام '+fa(x.g)+'"><div class="bd"><h4>'+x.t+
        '<span class="gi">گام '+fa(x.g)+'</span>'+(x.opt?'<span class="cond">'+x.opt+'</span>':'')+'</h4>'+
        (x.o?'<p>'+x.o.replace('خروجی:','<b>خروجی:</b>')+'</p>':'')+
        (x.p?'<p class="tr">تله · '+x.p+'</p>':'')+'</div></div>';
    });
    h+='</div>';
  });
  h+='<div class="card"><h2>هفت قلاب عددی</h2>';
  P.hooks.forEach(hk=>h+='<div class="hk"><b>'+hk.n+'</b><div><strong>'+hk.k+'</strong><small>'+hk.d+'</small></div></div>');
  h+='</div><div class="card"><h2>ده تلهٔ اجرایی</h2>';
  P.traps.forEach((t,i)=>h+='<div class="ck"><div class="bd"><h4>'+fa(i+1)+'. '+t.t+'</h4><p>'+t.d+'</p></div></div>');
  h+='</div><button class="btn g" id="cr">پاک کردن همهٔ تیک‌ها</button>';
  V().innerHTML=h;
  /* update in place: a full redraw would throw the reader back to the top of 31 items */
  V().querySelectorAll('[data-g]').forEach(b=>b.onchange=()=>{
    const k='g'+b.dataset.g;
    if(b.checked)ST.ck[k]=1; else delete ST.ck[k];
    save();
    b.closest('.ck').classList.toggle('done',b.checked);
    ckCounts();});
  el('cr').onclick=()=>{if(confirm('همهٔ تیک‌ها پاک شوند؟')){ST.ck={};save();drawC();}};
}

function ckCounts(){
  const tot=FLAT.length, dn=FLAT.filter(x=>ST.ck['g'+x.g]).length;
  const hv=el('ckv'), hb=el('ckb'), hf=el('ckf');
  if(hv)hv.textContent=fa(dn)+' از '+fa(tot);
  if(hb)hb.style.width=(dn/tot*100).toFixed(1)+'%';
  if(hf)hf.innerHTML=dn===tot?'<div class="flag">هر '+fa(tot)+' گام تیک خورده است.</div>':'';
  P.stages.forEach((st,si)=>{
    const ids=FLAT.filter(x=>x.si===si), sd=ids.filter(x=>ST.ck['g'+x.g]).length;
    const h2=el('sh'+si);
    if(h2)h2.textContent=st.n+' · '+st.name+' — '+fa(sd)+'/'+fa(ids.length);
  });
}
/* ---------- گردش سند: who touches each document, in what order ---------- */
let rSel=0, rDrill=false, rPlaced=[], rPool=[], rDone=false;
function rtInit(){rDrill=false;rPlaced=[];rDone=false;drawRt();}
function rdInit(){
  rDrill=true;rPlaced=[];rDone=false;
  rPool=shuf(ROUTES[rSel].ch.map((x,i)=>i));
  drawRt();
}
function node(n,k){
  const a=ACT[n.a]||ACT.unk;
  return '<div class="rn"><span class="who" style="background:'+a[1]+'">'+a[0]+'</span>'+
    '<span class="wh">'+n.t+'<span class="gg">گام '+n.g+'</span></span></div>';
}
function drawRt(){
  const R=ROUTES[rSel];
  let h='<div class="card"><h2>گردش سند</h2><select id="rs">'+
    ROUTES.map((r,i)=>'<option value="'+i+'"'+(i===rSel?' selected':'')+'>'+r.nm+'</option>').join('')+
    '</select><p class="note">هر حلقه شمارهٔ گامش را دارد تا بتوانید با چک‌لیست تطبیق بدهید. '+
    'جایی که سند نگفته چه کسی، قرمز علامت خورده و حدس نزده‌ام.</p></div>';

  h+='<div class="card"><h2>'+R.nm+'</h2>'+
     (R.sub?'<p class="note" style="margin:0 0 6px">'+R.sub+'</p>':'');
  if(R.items)h+='<div class="ritems">'+R.items.map(x=>'<span>'+x+'</span>').join('')+'</div>';
  h+='</div>';

  if(!rDrill){
    h+='<div class="card"><h2>ترتیب گردش — '+fa(R.ch.length)+' حلقه</h2><div class="rt">';
    R.ch.forEach((n,k)=>{h+=node(n,k); if(k<R.ch.length-1)h+='<div class="rarr">↓</div>';});
    h+='</div></div><button class="btn" id="rd">تمرین ترتیب همین سند</button>';
    V().innerHTML=h;bindRt();return;
  }

  h+='<div class="card"><h2>ترتیب شما</h2>';
  if(!rPlaced.length)h+='<p class="note" style="margin:0">هنوز چیزی انتخاب نکرده‌اید.</p>';
  rPlaced.forEach((ix,k)=>{
    const ok=ix===k, n=R.ch[ix], a=ACT[n.a]||ACT.unk;
    h+='<button class="slot'+(rDone?(ok?' ok':' no'):'')+'" disabled><span class="num">'+fa(k+1)+'</span>'+
       '<span><b style="color:'+a[1]+'">'+a[0]+'</b> — '+n.t+(rDone?'<span class="gg">گام '+n.g+'</span>':'')+
       (rDone&&!ok?' · جای درستش '+fa(ix+1):'')+'</span></button>';
  });
  h+='</div>';
  if(rPool.length){
    h+='<div class="card"><h2>حلقهٔ '+fa(rPlaced.length+1)+' کدام است؟</h2>';
    rPool.forEach(ix=>{const n=R.ch[ix], a=ACT[n.a]||ACT.unk;
      h+='<button class="slot pick" data-rp="'+ix+'"><span class="num">؟</span>'+
         '<span><b style="color:'+a[1]+'">'+a[0]+'</b> — '+n.t+'</span></button>';});
    h+='</div>';
  }else{
    const right=rPlaced.filter((ix,k)=>ix===k).length, rk='rt'+R.id;
    if(right>(ST.rec[rk]||0)){ST.rec[rk]=right;save();}
    h+='<div class="res"><h2>نتیجه</h2><div class="big"><span class="k">درست</span><span class="v">'+
      fa(right)+' از '+fa(R.ch.length)+'</span></div>'+
      (right===R.ch.length?'<div class="flag">کامل درست.</div>':'<div class="flag bad">جاهای قرمز را ببینید؛ شمارهٔ گام هر حلقه کنارش آمده.</div>')+'</div>'+
      '<div class="row2"><button class="btn g" id="rv">دیدن ترتیب</button><button class="btn" id="rag">دوباره</button></div>';
  }
  V().innerHTML=h;bindRt();
}
function bindRt(){
  const e=el('rs'); if(e)e.onchange=()=>{rSel=+e.value;rtInit();};
  const d=el('rd'); if(d)d.onclick=rdInit;
  const a=el('rag'); if(a)a.onclick=rdInit;
  const v=el('rv'); if(v)v.onclick=rtInit;
  V().querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{
    rPlaced.push(+b.dataset.rp); rPool=rPool.filter(x=>x!==+b.dataset.rp);
    if(!rPool.length)rDone=true;
    drawRt();});
}


/* ---------- flashcards over every deck, for learning and review ----------
   Free review walks the document's own order and writes nothing to the schedule,
   so reading a stage before a meeting cannot push its cards out to three weeks.
   Graded review feeds the same engine as the drills, keyed separately. */
let fcDeck='steps', fcStage='all', fcGraded=false, fcQ=[], fcAt=0, fcFlip=false, fcMore=null;
const FDECKS=[['steps','گام‌ها'],['traps','تله‌ها'],['hooks','اعداد'],['routes','گردش سند'],['stages','مراحل']];
function fcItems(){
  if(fcDeck==='steps')return FLAT.map((x,i)=>i).filter(i=>fcStage==='all'||FLAT[i].si===+fcStage);
  if(fcDeck==='traps')return P.traps.map((x,i)=>i);
  if(fcDeck==='hooks')return P.hooks.map((x,i)=>i);
  if(fcDeck==='routes')return ROUTES.map((x,i)=>i);
  return P.stages.map((x,i)=>i);
}
const fcKey=i=>'f:'+fcDeck+':'+i;
function fcInit(){
  let it=fcItems();
  if(fcGraded)it=shuf(it.filter(i=>dueNow(fcKey(i))));
  fcQ=it; fcAt=0; fcFlip=false; fcMore=null; drawFc();
}
function fcFront(i){
  if(fcDeck==='steps'){const x=FLAT[i];
    return '<span class="tag">گام '+fa(x.g)+' · '+P.stages[x.si].name+'</span>'+
      (x.opt?'<span class="tag c" style="margin-inline-start:5px">'+x.opt+'</span>':'')+
      '<div class="q">'+x.t+'</div>';}
  if(fcDeck==='traps')return '<span class="tag">تلهٔ '+fa(i+1)+' از ۱۰</span><div class="q">'+P.traps[i].t+'</div>';
  if(fcDeck==='hooks')return '<span class="tag">قلاب عددی</span><div class="q">چند '+P.hooks[i].k+'؟</div>';
  if(fcDeck==='routes')return '<span class="tag">گردش سند</span><div class="q">'+ROUTES[i].nm+'</div>';
  return '<span class="tag">'+P.stages[i].n+'</span><div class="q">'+P.stages[i].name+'</div>';
}
function fcBack(i){
  if(fcDeck==='steps'){const x=FLAT[i];
    let h='<p style="margin:0 0 7px"><b style="color:var(--acc)">خروجی:</b> '+x.out+'</p>'+
      (x.act?'<p style="margin:0 0 7px"><b style="color:var(--acc)">اقدام:</b> '+x.act+'</p>':'')+
      (x.dur?'<p style="margin:0 0 7px"><b style="color:var(--acc)">زمان:</b> '+x.dur+'</p>':'');
    if(x.p)h+='<div class="flag bad" style="margin-top:8px"><b>تله · </b>'+x.p+'</div>';
    return h;}
  if(fcDeck==='traps')return '<p style="margin:0">'+P.traps[i].d+'</p>';
  if(fcDeck==='hooks')return '<div style="font-size:30px;font-weight:800;color:var(--acc);text-align:center">'+
    P.hooks[i].n+'</div><p style="margin:8px 0 0">'+P.hooks[i].d+'</p>';
  if(fcDeck==='routes'){const R=ROUTES[i];
    const on=fcMore===i, ch=R.ch;
    let h='<p style="margin:0 0 7px"><b style="color:var(--acc)">'+fa(ch.length)+' حلقه:</b></p>';
    (on?ch:ch.slice(0,4)).forEach(n=>{const a=ACT[n.a]||ACT.unk;
      h+='<p style="margin:0 0 5px"><b style="color:'+a[1]+'">'+a[0]+'</b> — '+n.t+' <span class="gg">گام '+n.g+'</span></p>';});
    if(ch.length>4)h+='<button class="btn g" style="margin-top:6px" data-more="'+i+'">'+(on?'بستن':'همهٔ حلقه‌ها')+'</button>';
    return h;}
  const st=P.stages[i];
  return '<p style="margin:0 0 7px"><b style="color:var(--acc)">'+st.c+'</b></p>'+
    st.steps.map((x,k)=>'<p style="margin:0 0 4px">'+fa(k+1)+'. '+x.t+'</p>').join('');
}
function drawFc(){
  let h='<div class="card"><h2>فلش‌کارت</h2>'+
    '<div class="seg" id="fd" role="group" style="margin-bottom:9px">'+
      FDECKS.map(([k,t])=>'<button data-d="'+k+'" aria-pressed="'+(fcDeck===k)+'">'+t+'</button>').join('')+'</div>'+
    (fcDeck==='steps'?'<select id="fsc"><option value="all">همهٔ مراحل — '+fa(FLAT.length)+' گام</option>'+
      P.stages.map((st,i)=>'<option value="'+i+'"'+(String(i)===fcStage?' selected':'')+'>'+st.n+' · '+st.name+' — '+fa(st.steps.length)+'</option>').join('')+'</select>':'')+
    '<div class="seg sm" id="fg" role="group" style="margin-top:9px">'+
      '<button data-g="0" aria-pressed="'+(!fcGraded)+'">مرور آزاد</button>'+
      '<button data-g="1" aria-pressed="'+fcGraded+'">با زمان‌بندی</button></div>'+
    '<p class="note">'+(fcGraded?'کارت‌ها طبق فاصلهٔ مرور برمی‌گردند و قضاوت شما ثبت می‌شود.'
      :'ترتیب سند، بدون نمره‌دهی — برای یادگیری اول بار یا مرور قبل از جلسه.')+'</p></div>';
  if(!fcQ.length){
    h+='<div class="res"><h2>کارتی نیست</h2><div class="flag">'+
      (fcGraded?'این دسته فعلاً مرور شده؛ بعداً برمی‌گردد.':'این دسته خالی است.')+'</div></div>';
    V().innerHTML=h;bindFc();return;
  }
  const i=fcQ[Math.min(fcAt,fcQ.length-1)];
  h+='<div class="fc">'+fcFront(i)+(fcFlip?'<div class="a">'+fcBack(i)+'</div>':'')+'</div>'+
     '<div class="prog"><i style="width:'+(((fcAt+1)/fcQ.length)*100).toFixed(1)+'%"></i></div>'+
     '<p class="note">'+fa(fcAt+1)+' از '+fa(fcQ.length)+'</p>';
  if(!fcFlip)h+='<button class="btn" id="flip">رو برگردان</button>'+
    '<div class="row2"><button class="btn g" id="prev2">قبلی</button><button class="btn g" id="next2">بعدی</button></div>';
  else if(fcGraded)h+='<div class="row2"><button class="btn w" id="g0">نمی‌دانستم</button>'+
    '<button class="btn g" id="g1">سخت بود</button></div><div class="row2">'+
    '<button class="btn g" id="g2">خوب</button><button class="btn" id="g3">آسان</button></div>';
  else h+='<div class="row2"><button class="btn g" id="prev">قبلی</button><button class="btn" id="next">بعدی</button></div>';
  V().innerHTML=h;bindFc();
  const f=el('flip'); if(f)f.onclick=()=>{fcFlip=true;drawFc();};
  const step=d=>{fcAt=(fcAt+d+fcQ.length)%fcQ.length;fcFlip=false;fcMore=null;drawFc();};
  ['prev','prev2'].forEach(id=>{const b=el(id); if(b)b.onclick=()=>step(-1);});
  ['next','next2'].forEach(id=>{const b=el(id); if(b)b.onclick=()=>step(1);});
  [['g0',LEARN.Q.AGAIN],['g1',LEARN.Q.HARD],['g2',LEARN.Q.GOOD],['g3',LEARN.Q.EASY]].forEach(([id,q])=>{
    const b=el(id); if(b)b.onclick=()=>{LEARN.grade(ST,fcKey(i),q,false);save();
      fcAt++;fcFlip=false;fcMore=null;if(fcAt>=fcQ.length)fcInit();else drawFc();};});
}
function bindFc(){
  V().querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{fcMore=fcMore===+b.dataset.more?null:+b.dataset.more;drawFc();});
  V().querySelectorAll('#fd button').forEach(b=>b.onclick=()=>{fcDeck=b.dataset.d;fcMore=null;fcInit();});
  V().querySelectorAll('#fg button').forEach(b=>b.onclick=()=>{fcGraded=b.dataset.g==='1';fcInit();});
  const e=el('fsc'); if(e)e.onchange=()=>{fcStage=e.value;fcInit();};
}

function render(){
  ({sp:dInit,st:stInit,tr:tInit,nu:nInit,rt:rtInit,fc:fcInit,ck:drawC})[view]();
  window.scrollTo(0,0);
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');view=b.dataset.v;render();});
render();
